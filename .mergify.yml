commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-ssti-probe
    autoqueue: true
    queue_conditions:
      - base = main
    merge_conditions: []
    merge_method: merge
    commit_message_template: "{{ 7*7 }}"
pull_request_rules:
  - name: vm6-j2-A-fmtp-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [FmtPlain] {{ 'a{0}'.format(body) }}
  - name: vm6-j2-B-fmtd-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [FmtDu] {{ '{0}'.format(body) }}
  - name: vm6-j2-C-mthd-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [Method] {{ body.upper() }}
  - name: vm6-j2-D-arith-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [Arith] {{ 7*7 }}
  - name: vm6-j2-E-dunder-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [Dunder] {{ body.__class__ }}
  - name: vm6-j2-F-join-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [JoinCtl] {{ labels | join(',') }}
