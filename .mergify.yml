pull_request_rules:
  - name: vm6-j2-nested-261016
    conditions:
      - label = vm6-j2-nested
    actions:
      comment:
        message: "NEST={{ body }}"
  - name: vm6-j2-range-261016
    conditions:
      - label = vm6-j2-range
    actions:
      comment:
        message: "{% for x in range(3) %}R{{ x }}{% endfor %}"
  - name: vm6-j2-attr-261016
    conditions:
      - label = vm6-j2-attr
    actions:
      comment:
        message: "ATTR={{ author | attr('__class__') }}"
  - name: vm6-j2-split-261016
    conditions:
      - label = vm6-j2-split
    actions:
      comment:
        message: "SPLIT={{ body.split('PWN') }}"
  - name: vm6-j2-debug-261016
    conditions:
      - label = vm6-j2-debug
    actions:
      comment:
        message: "{% debug %}"
  - name: vm6-j2-inc-261016
    conditions:
      - label = vm6-j2-inc
    actions:
      comment:
        message: "{% include '/etc/passwd' %}"
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-qrule-new-261005
    queue_conditions:
      - base = vm6-qrule-target-261005
      - title = VM6_QRULE_REMOVE_261005
    merge_conditions:
      - label = VM6_NEVER_ALLOW_261005
    batch_size: 2
    batch_max_wait_time: 90 seconds
    merge_method: merge
    max_checks_retries: 0
    checks_timeout: null
