pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
scopes:
  source:
    files:
      scope-a:
        include:
          - scope-a/**
      scope-b:
        include:
          - scope-b/**
      meta:
        include:
          - .mergify.yml
          - .github/workflows/vm6-direct-merge-positive.yml
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-direct-merge-positive-20260925
    batch_size: 1
    queue_conditions:
      - title ~= ^VM6_DM_(SEED|TARGET)_POSITIVE_20260925$
    merge_conditions:
      - check-success = vm6-dm-guard
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
