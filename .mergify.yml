pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
scopes:
  source:
    files:
      docs:
        include:
          - docs/**
      privileged:
        include:
          - privileged/**
queue_rules:
  - name: vm6-g1scope-normal-261016
    queue_conditions:
      - base = vm6-g1scope-normal-261016
      - title = VM6_G1SCOPE_NORMAL_261016
      - scope = privileged
    merge_conditions:
      - title != VM6_NEVER_ALLOW_G1SCOPE_261016
    merge_method: merge
    batch_size: 1
    batch_max_wait_time: 15 seconds
    max_checks_retries: 0
    checks_timeout: null
