pull_request_rules: []

queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-r13-revision-gate
      - check-success = vm6-r13-rewrite-release
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge

merge_queue:
  mode: serial
  max_parallel_checks: 1
