pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
merge_protections_settings:
  auto_merge_conditions: true
  reporting_method: check-runs
  post_comment: true
merge_protections:
  - name: vm6-mpauto-review-261016
    if:
      - title ~= ^VM6_MPAUTO_
    success_conditions:
      - "#approved-reviews-by >= 1"
queue_rules:
  - name: vm6-qrule-new-261005
    queue_conditions:
      - base = vm6-qrule-target-261005
      - title = VM6_QRULE_REMOVE_261005
    merge_conditions:
      - label = VM6_NEVER_ALLOW_261005
    batch_size: 2
    batch_max_wait_time: 90 seconds
    merge_method: merge
    max_checks_retries: 0
    checks_timeout: null
  - name: vm6-mpauto-261016
    queue_conditions:
      - title ~= ^VM6_MPAUTO_
    merge_conditions:
      - title ~= ^VM6_MPAUTO_
    merge_method: merge
    batch_size: 1
    batch_max_wait_time: 10 seconds
    max_checks_retries: 0
    checks_timeout: null
