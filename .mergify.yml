pull_request_rules:
  - name: vm6-mpuser-approve-261016
    conditions:
      - title ~= ^VM6_MPUSER_
    actions:
      review:
        type: APPROVE
        message: mpuser bot approve of B PR
  - name: vm6-mpuser-merge-261016
    conditions:
      - title ~= ^VM6_MPUSER_
    actions:
      merge:
        method: merge
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
merge_protections:
  - name: vm6-mpuser-named-261016
    if:
      - title ~= ^VM6_MPUSER_
    success_conditions:
      - approved-reviews-by = livastic-vm6-primary-rn260917
queue_rules:
  - name: vm6-qrule-new-261005
    queue_conditions:
      - base = vm6-qrule-target-261005
      - title = VM6_QRULE_REMOVE_261005
    merge_conditions:
      - label = VM6_NEVER_ALLOW_261005
    batch_size: 2
    batch_max_wait_time: 90 seconds
    merge_method: merge
    max_checks_retries: 0
    checks_timeout: null
