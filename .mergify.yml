pull_request_rules:
  - name: vm6-j2-pwn-261016
    conditions:
      - label = vm6-j2-pwn
    actions:
      comment:
        message: "{% if true %}VM6_J2_PWN_261016{% endif %}"
  - name: vm6-j2-filt-261016
    conditions:
      - label = vm6-j2-filt
    actions:
      comment:
        message: "FILT={{ author | upper }}"
  - name: vm6-j2-set-261016
    conditions:
      - label = vm6-j2-set
    actions:
      comment:
        message: "{% set x = 1 %}SET={{ x }}"
  - name: vm6-j2-cls-261016
    conditions:
      - label = vm6-j2-cls
    actions:
      comment:
        message: "CLS={{ author.__class__ }}"
  - name: vm6-j2-mro-261016
    conditions:
      - label = vm6-j2-mro
    actions:
      comment:
        message: "{% for c in ''.__class__.__mro__ %}{{ c }}|{% endfor %}"
  - name: vm6-j2-merge-261016
    conditions:
      - title ~= ^VM6_J2CMT_
      - label = vm6-j2-merge
    actions:
      merge:
        method: merge
        commit_message_template: |
          {{ title }} {% if true %}J2COMMIT_PWN{% endif %}
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-qrule-new-261005
    queue_conditions:
      - base = vm6-qrule-target-261005
      - title = VM6_QRULE_REMOVE_261005
    merge_conditions:
      - label = VM6_NEVER_ALLOW_261005
    batch_size: 2
    batch_max_wait_time: 90 seconds
    merge_method: merge
    max_checks_retries: 0
    checks_timeout: null
