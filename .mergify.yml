pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: parallel
  max_parallel_checks: 2
scopes:
  source:
    files:
      privileged:
        include:
          - secret/**
      other:
        include:
          - other/**
  barrier_files:
    include:
      - barrier/**
queue_rules:
  - name: vm6-qrule-new-261005
    queue_conditions:
      - base = vm6-qrule-target-261005
      - title = VM6_QRULE_REMOVE_261005
    merge_conditions:
      - label = VM6_NEVER_ALLOW_261005
    batch_size: 1
    batch_max_wait_time: 10 seconds
    merge_method: merge
    max_checks_retries: 0
    checks_timeout: null
  - name: vm6-barrn-261016
    queue_conditions:
      - title ~= ^VM6_BARRN_
    merge_conditions:
      - title != VM6_NEVER_ALLOW_BARRN_261016
    merge_method: merge
    batch_size: 1
    batch_max_wait_time: 10 seconds
    max_checks_retries: 0
    checks_timeout: null
