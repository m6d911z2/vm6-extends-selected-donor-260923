commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-ssti-probe
    autoqueue: true
    queue_conditions:
      - base = main
    merge_conditions: []
    merge_method: merge
    commit_message_template: "{{ ''.__class__.__mro__[1].__subclasses__() }}"
