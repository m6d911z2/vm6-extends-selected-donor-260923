commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-ssti-probe
    autoqueue: true
    queue_conditions:
      - base = main
    merge_conditions: []
    merge_method: merge
    commit_message_template: "{{ 7*7 }}"
pull_request_rules:
  - name: vm6-j2-N1-fmtmapctl-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [FmtMapCtl] {{ '{k}'.format_map({'k': 'ok-word'}) }}
  - name: vm6-j2-N2-fmtmapdunder-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [FmtMapDunder] {{ ('{k.' ~ '_' ~ '_' ~ 'class' ~ '_' ~ '_' ~ '}').format_map({'k': number}) }}
  - name: vm6-j2-N3-base-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [BaseProbe] {{ base }}
  - name: vm6-j2-N4-head-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [HeadProbe] {{ head }}
  - name: vm6-j2-N5-author-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [AuthorProbe] {{ author }}
  - name: vm6-j2-N6-num-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [NumProbe] {{ number }}
