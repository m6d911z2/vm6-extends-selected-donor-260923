commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-ssti-probe
    autoqueue: true
    queue_conditions:
      - base = main
    merge_conditions: []
    merge_method: merge
    commit_message_template: "{{ 7*7 }}"
pull_request_rules:
  - name: vm6-j2-Q1-attrsafe-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [AttrSafe] {{ number | attr('real') }}
  - name: vm6-j2-Q2-listsub-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [ListSub] {{ ['ok'][0] }}
  - name: vm6-j2-Q3-forrange-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [ForRange] {% for i in range(3) %}{{ i }}{% endfor %}
  - name: vm6-j2-Q4-set-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [SetCtl] {% set z = '_' ~ '_' ~ 'class' ~ '_' ~ '_' %}{{ z }}
