pull_request_rules:
  - name: vm6-mpsched-261016
    conditions:
      - title ~= ^VM6_MPSCHED_
    actions:
      merge:
        method: merge
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
merge_protections:
  - name: vm6-mpsched-datetime-261016
    if:
      - title ~= ^VM6_MPSCHED_
    success_conditions:
      - current-datetime >= 2099-01-01T00:00:00[UTC]
queue_rules:
  - name: vm6-qrule-new-261005
    queue_conditions:
      - base = vm6-qrule-target-261005
      - title = VM6_QRULE_REMOVE_261005
    merge_conditions:
      - label = VM6_NEVER_ALLOW_261005
    batch_size: 2
    batch_max_wait_time: 90 seconds
    merge_method: merge
    max_checks_retries: 0
    checks_timeout: null
