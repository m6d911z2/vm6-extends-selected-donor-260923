pull_request_rules:
  - name: vm6-copyq-copy-261016
    conditions:
      - title ~= ^VM6_COPYQ_ATK_
      - base = vm6-copyq-src-261016
    actions:
      copy:
        branches:
          - vm6-copyq-base-261016
        title: "VM6_COPYQ_COPY_{{ number }}"
        ignore_conflicts: true
        report_mode:
          - check
          - comment
  - name: vm6-copyq-merge-261016
    conditions:
      - title ~= ^VM6_COPYQ_COPY_
      - base = vm6-copyq-base-261016
      - head ~= ^mergify/copy/
    actions:
      merge:
        method: merge
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-qrule-new-261005
    queue_conditions:
      - base = vm6-qrule-target-261005
      - title = VM6_QRULE_REMOVE_261005
    merge_conditions:
      - label = VM6_NEVER_ALLOW_261005
    batch_size: 2
    batch_max_wait_time: 90 seconds
    merge_method: merge
    max_checks_retries: 0
    checks_timeout: null
