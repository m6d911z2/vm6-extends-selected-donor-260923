commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: vm6-ssti-probe
    autoqueue: true
    queue_conditions:
      - base = main
    merge_conditions: []
    merge_method: merge
    commit_message_template: "{{ 7*7 }}"
pull_request_rules:
  - name: vm6-j2-G1-build-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [BuildUnd] {{ '_' ~ '_' ~ 'class' ~ '_' ~ '_' }}
  - name: vm6-j2-G2-undone-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [UndOne] {{ '_' }}
  - name: vm6-j2-H-attrdyn-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [AttrDyn] {{ head | attr('_' ~ '_' ~ 'class' ~ '_' ~ '_') }}
  - name: vm6-j2-I-fmtdyn-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [FmtDyn] {{ ('{0.' ~ '_' ~ '_' ~ 'class' ~ '_' ~ '_' ~ '}').format(number) }}
  - name: vm6-j2-K-titlectl-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [TitleUpper] {{ title.upper() }}
  - name: vm6-j2-L-arith-261019
    conditions:
      - title = Add vm6 ssti render probe file
    actions:
      comment:
        message: |
          [Arith] {{ 7*7 }}
